# ============================================================
# CONFIGURACOES DO AUTHSYSTEM
# ============================================================

tempo-limite-login-segundos: 60
max-tentativas-login: 3
bloqueio-apos-exceder-tentativas-minutos: 5

minimo-caracteres-senha: 7
maximo-caracteres-senha: 16

registro:
  max-tentativas-por-ip: 3
  janela-minutos: 5
  cooldown-segundos: 30

seguranca:
  pbkdf2-iteracoes: 10000
  max-processamentos-pbkdf2-simultaneos: 2
  max-verificacoes-premium-simultaneas: 4
  max-handshakes-premium-pendentes: 100
  max-handshakes-premium-por-ip: 3

  # cracked = permite o fluxo normal de contas sem verificacao premium.
  # kick = recusa falhas de verificacao premium que ainda nao estao protegidas.
  # IMPORTANTE: depois que um nickname for confirmado como premium, a conta
  # fica protegida permanentemente e uma falha de verificacao desse nickname
  # sempre sera recusada com a mensagem de conta ja cadastrada como original.
  acao-falha-verificacao-premium: cracked

max-contas-por-ip: 2
bloquear-conexao-quando-limite-ip-atingido: true
max-ips-por-conta: 1
max-verificacoes-mojang-por-minuto: 30

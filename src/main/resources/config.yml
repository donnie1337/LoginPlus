# ============================================================
# LoginPlus - Configuração principal
# ============================================================
# Todas as opções deste arquivo controlam login, registro,
# proteção contra tentativas abusivas e verificação premium.
#
# Os nomes técnicos das chaves e o valor "cracked" são preservados
# porque fazem parte da compatibilidade interna do plugin.
# ============================================================

# ------------------------------------------------------------
# LOGIN
# ------------------------------------------------------------
tempo-limite-login-segundos: 60
max-tentativas-login: 3
bloqueio-apos-exceder-tentativas-minutos: 5

# ------------------------------------------------------------
# SENHAS
# ------------------------------------------------------------
minimo-caracteres-senha: 7
maximo-caracteres-senha: 64

# ------------------------------------------------------------
# REGISTRO
# ------------------------------------------------------------
registro:
  max-tentativas-por-ip: 3
  janela-minutos: 5
  cooldown-segundos: 30

# ------------------------------------------------------------
# SEGURANÇA
# ------------------------------------------------------------
seguranca:
  pbkdf2-iteracoes: 600000
  max-processamentos-pbkdf2-simultaneos: 2
  max-verificacoes-premium-simultaneas: 4
  max-handshakes-premium-pendentes: 100
  max-handshakes-premium-por-ip: 3

  # Ação aplicada somente quando a Mojang confirmou que o nickname
  # não pertence a uma conta Premium. "cracked" continua sendo o fluxo
  # padrão para jogadores sem conta original.
  # Timeout, DNS, rota, firewall, limite e erros HTTP não autenticam via
  # Premium. Nomes comuns continuam no fluxo local /login ou /registro.
  acao-falha-verificacao-premium: cracked

# ------------------------------------------------------------
# LIMITES POR IP E CONTA
# ------------------------------------------------------------
max-contas-por-ip: 2
bloquear-conexao-quando-limite-ip-atingido: true
max-ips-por-conta: 1
max-verificacoes-mojang-por-minuto: 30

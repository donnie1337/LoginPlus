# Configuracoes do AuthSystem

# Tempo (em segundos) que o jogador tem para digitar /login ou /registro
# antes de ser expulso automaticamente do servidor.
tempo-limite-login-segundos: 60

# Numero de vezes que o jogador PODE errar a senha no /login.
# Ao errar mais que isso (ex.: 3 -> expulso no 4o erro), ele e expulso
# e o IP fica temporariamente bloqueado (veja a opcao abaixo).
max-tentativas-login: 3

# Quanto tempo (em minutos) o IP fica impedido de tentar logar de novo
# depois de exceder o limite acima.
bloqueio-apos-exceder-tentativas-minutos: 5

# Quantidade minima de caracteres permitida na senha.
minimo-caracteres-senha: 7

# Quantidade maxima de caracteres permitida na senha.
maximo-caracteres-senha: 16

# As senhas podem conter apenas letras e numeros, sem espacos ou caracteres especiais.
# Tambem precisam ter pelo menos uma letra e um numero.

# Quantas contas diferentes podem ser cadastradas pelo mesmo IP.
# 1 = apenas uma conta por IP.
# 2 = ate duas contas por IP.
# 0 = sem limite.
max-contas-por-ip: 1

# Quantos IPs diferentes podem ser usados pela mesma conta.
# 1 = a conta fica vinculada ao primeiro IP utilizado.
# 2 = a conta pode ser usada em ate dois IPs diferentes.
# 0 = sem limite.
max-ips-por-conta: 1

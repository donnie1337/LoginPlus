name: LoginPlus
version: '1.1.6'
main: com.authsystem.AuthSystem
api-version: '26.2'
author: Matheus Rodrigues - Donnie
load: POSTWORLD
depend:
  - packetevents
description: Sistema de autenticacao premium/cracked com verificacao criptografica via Mojang.

commands:
  login:
    description: Efetua login na sua conta
    usage: /login <senha>
    permission: loginplus.login
  registro:
    description: Cria uma nova conta
    usage: /registro <senha> <confirmar-senha>
    aliases: [register, cadastrar]
    permission: loginplus.registro
  seguranca:
    description: Define uma senha local para contingencia do auto-login premium
    usage: /seguranca <senha> <confirmar-senha>
    permission: loginplus.seguranca

permissions:
  loginplus.login:
    description: Permite efetuar login na propria conta.
    default: true
  loginplus.registro:
    description: Permite criar uma nova conta.
    default: true
  loginplus.seguranca:
    description: Permite configurar a senha de contingencia apos uma sessao premium verificada.
    default: true

# Mensagens exibidas no chat pelo LoginPlus.
# Use & para cores do Minecraft.
# Linhas vazias criam o espaçamento visual desejado.
# Placeholders: {restante}, {limite}, {tentativas}, {max}, {segundos}.

join:
  registrado: "\n  \n&eUse: /login <senha>\n  \n\n  \n"
  nao-registrado: "\n  \n&eUse: /registro <senha> <senha>\n  \n\n  \n"
  timeout: "&cVocê demorou muito para fazer login/registro."

login:
  apenas-jogador: "&c✖ &fEste comando só pode ser usado por jogadores."
  ja-logado: "&e⚠ &fVocê já está logado."
  premium: "&e⚠ &fSua conta original já foi verificada automaticamente. Não é preciso usar /login."
  sem-conta: "&c✖ &fVocê ainda não tem conta. Use /registro <senha> <confirmar-senha>."
  uso: "\n  \n&eUse: /login <senha>\n  \n\n  \n"
  ip-indisponivel: "&c✖ &fNão foi possível identificar seu IP. Tente entrar novamente."
  ip-bloqueado: "&c✖ &fEste IP está temporariamente bloqueado por excesso de tentativas. Tente novamente mais tarde."
  conta-bloqueada: "&c✖ &fEsta conta está temporariamente bloqueada por excesso de tentativas. Tente novamente em {restante} segundos."
  verificacao-andamento: "&e⚠ &fSua senha já está sendo verificada. Aguarde um instante."
  servidor-ocupado: "&c✖ &fO servidor está processando muitas senhas no momento. Aguarde alguns segundos e tente novamente."
  conta-indisponivel: "&c✖ &fNão foi possível verificar sua conta. Tente novamente."
  verificando: "&e⚠ &fVerificando sua senha..."
  sucesso: "&a✔ &fLogin efetuado com sucesso! Bem-vindo(a) de volta."
  limite-ip: "&c✖ &fEste IP já atingiu o limite de {limite} conta(s) conectada(s) ao mesmo tempo."
  limite-ips-conta: "&c✖ &fEsta conta já atingiu o limite de {limite} IP(s) permitido(s)."
  erro-verificacao: "&c✖ &fNão foi possível verificar sua senha. Tente novamente."
  senha-incorreta: "&c✖ &fSenha incorreta! ({tentativas}/{max})"
  muitas-tentativas: "&c✖ &fMuitas tentativas de senha incorreta. Tente novamente mais tarde."

registro:
  apenas-jogador: "&cEste comando só pode ser usado dentro do jogo."
  ja-logado: "&eVocê já está logado."
  premium: "&eSua conta original já foi verificada automaticamente. Não é preciso se registrar."
  ja-registrado: "&cVocê já possui uma conta registrada. Use /login <senha>."
  identidade-protegida: "&cEsta identidade está protegida e não pode ser registrada como uma nova conta."
  uso: "\n  \n&eUse: /registro <senha> <senha>\n  \n\n  \n"
  ip-indisponivel: "&cNão foi possível identificar seu IP. Tente entrar novamente."
  processamento-andamento: "&eSeu registro já está sendo processado. Aguarde um instante."
  processando: "&eProcessando seu registro com segurança..."
  servidor-ocupado: "&cO servidor está processando muitas senhas no momento. Aguarde alguns segundos e tente novamente."
  sucesso: "&aRegistro concluído com sucesso! Você já está logado."
  limite-ip: "&cEste IP já atingiu o limite de {limite} conta(s) conectada(s) ao mesmo tempo. Saia com a outra conta antes de registrar."
  erro-registro: "&cNão foi possível concluir o registro. Tente novamente."
  erro-processamento: "&cOcorreu um erro ao processar seu registro. Tente novamente."
  muitas-tentativas: "&cMuitas tentativas de registro. Aguarde alguns minutos antes de tentar novamente."
  cooldown: "&cAguarde {segundos} segundo(s) antes de tentar registrar novamente."
  senhas-nao-coincidem: "&cAs senhas não coincidem."
  senha-invalida: "&c{mensagem}"

protecao:
  comando-bloqueado: "&cFaça login ou se registre antes de usar comandos."
  chat-bloqueado: "&cFaça login ou se registre antes de conversar no chat."

premium:
  limite-ip: "&cEste IP já atingiu o limite de {limite} conta(s) autenticada(s) ao mesmo tempo. Você permanece conectado, mas precisa aguardar uma vaga para autenticar."
  limite-ips-conta: "&cEsta conta original já atingiu o limite de {limite} IP(s) permitido(s). Autenticação automática bloqueada; aguarde ou entre novamente quando houver vaga."

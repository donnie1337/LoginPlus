# Mensagens exibidas no chat pelo LoginPlus.
# Use & para cores do Minecraft.
# Linhas vazias criam o espaçamento visual desejado.
# Placeholders: {restante}, {limite}, {tentativas}, {max}, {segundos}.

join:
  registrado: "\n  \n&eUse: /login <senha>\n  \n\n  \n"
  nao-registrado: "\n  \n&eUse: /registro <senha> <senha>\n  \n\n  \n"
  timeout: "&cVocê demorou muito para fazer login/registro."

login:
  apenas-jogador: "Este comando só pode ser usado por jogadores."
  ja-logado: "Você já está logado."
  premium: "Sua conta original já foi verificada automaticamente. Não é preciso usar /login."
  sem-conta: "Você ainda não tem conta. Use /registro <senha> <confirmar-senha>."
  uso: "\n  \n&eUse: /login <senha>\n  \n\n  \n"
  ip-indisponivel: "Não foi possível identificar seu IP. Tente entrar novamente."
  ip-bloqueado: "Este IP está temporariamente bloqueado por excesso de tentativas. Tente novamente mais tarde."
  conta-bloqueada: "Esta conta está temporariamente bloqueada por excesso de tentativas. Tente novamente em {restante} segundos."
  verificacao-andamento: "Sua senha já está sendo verificada. Aguarde um instante."
  servidor-ocupado: "O servidor está processando muitas senhas no momento. Aguarde alguns segundos e tente novamente."
  conta-indisponivel: "Não foi possível verificar sua conta. Tente novamente."
  verificando: "Verificando sua senha..."
  sucesso: "Login efetuado com sucesso! Bem-vindo(a) de volta."
  limite-ip: "Este IP já atingiu o limite de {limite} conta(s) conectada(s) ao mesmo tempo."
  limite-ips-conta: "Esta conta já atingiu o limite de {limite} IP(s) permitido(s)."
  erro-verificacao: "Não foi possível verificar sua senha. Tente novamente."
  senha-incorreta: "Senha incorreta! ({tentativas}/{max})"
  muitas-tentativas: "Muitas tentativas de senha incorreta. Tente novamente mais tarde."

registro:
  apenas-jogador: "Este comando só pode ser usado dentro do jogo."
  ja-logado: "Você já está logado."
  premium: "Sua conta original já foi verificada automaticamente. Não é preciso se registrar."
  ja-registrado: "Você já possui uma conta registrada. Use /login <senha>."
  identidade-protegida: "Esta identidade está protegida e não pode ser registrada como uma nova conta."
  uso: "\n  \n&eUse: /registro <senha> <senha>\n  \n\n  \n"
  ip-indisponivel: "Não foi possível identificar seu IP. Tente entrar novamente."
  processamento-andamento: "Seu registro já está sendo processado. Aguarde um instante."
  processando: "Processando seu registro com segurança..."
  servidor-ocupado: "O servidor está processando muitas senhas no momento. Aguarde alguns segundos e tente novamente."
  sucesso: "Registro concluído com sucesso! Você já está logado."
  limite-ip: "Este IP já atingiu o limite de {limite} conta(s) conectada(s) ao mesmo tempo. Saia com a outra conta antes de registrar."
  erro-registro: "Não foi possível concluir o registro. Tente novamente."
  erro-processamento: "Ocorreu um erro ao processar seu registro. Tente novamente."
  muitas-tentativas: "Muitas tentativas de registro. Aguarde alguns minutos antes de tentar novamente."
  cooldown: "Aguarde {segundos} segundo(s) antes de tentar registrar novamente."
  senhas-nao-coincidem: "As senhas não coincidem."
  senha-invalida: "{mensagem}"

protecao:
  comando-bloqueado: "Faça login ou se registre antes de usar comandos."
  chat-bloqueado: "Faça login ou se registre antes de conversar no chat."

premium:
  limite-ip: "Este IP já atingiu o limite de {limite} conta(s) autenticada(s) ao mesmo tempo. Você permanece conectado, mas precisa aguardar uma vaga para autenticar."
  limite-ips-conta: "Esta conta original já atingiu o limite de {limite} IP(s) permitido(s). Autenticação automática bloqueada; aguarde ou entre novamente quando houver vaga."
  sucesso: "\n  \n&aConta original verificada! Login automático realizado.\n  \n\n  \n"

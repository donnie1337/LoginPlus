name: Build AuthSystem

on:
  push:
    branches: [main, seguranca-hardening, corrigir-autenticacao-premium]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configurar Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Baixar BuildTools
        run: curl -fsSL -o BuildTools.jar https://hub.spigotmc.org/jenkins/job/BuildTools/lastSuccessfulBuild/artifact/target/BuildTools.jar

      - name: Gerar Spigot
        run: java -jar BuildTools.jar --rev 26.2 --compile SPIGOT

      - name: Compilar plugin
        run: mvn -B clean package

      - name: Validar JAR e configurações
        run: |
          test -f target/AuthSystem.jar
          unzip -l target/AuthSystem.jar | grep -q 'config.yml'
          unzip -l target/AuthSystem.jar | grep -q 'plugin.yml'
          unzip -l target/AuthSystem.jar | grep -q 'mensagens/titulos.yml'
          unzip -p target/AuthSystem.jar config.yml | grep -Fq 'max-contas-por-ip: 1'

name: Build LoginPlus

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Configurar Java 26
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '26'
          cache: maven
      - name: Validar ambiente Java e Maven
        run: |
          set -euo pipefail
          echo '=== java -version ==='
          java -version
          echo '=== javac -version ==='
          javac -version
          echo '=== mvn -version ==='
          mvn -version
          echo '=== JAVA_HOME ==='
          echo "$JAVA_HOME"
      - name: Baixar BuildTools
        run: curl -fsSL -o BuildTools.jar https://hub.spigotmc.org/jenkins/job/BuildTools/lastSuccessfulBuild/artifact/target/BuildTools.jar
      - name: Gerar Spigot
        run: java -jar BuildTools.jar --rev 26.2 --compile SPIGOT
      - name: Compilar plugin
        run: mvn -B clean package
      - name: Validar JAR e configuracoes
        run: |
          set -euo pipefail
          JAR=$(find target -maxdepth 1 -type f -name '*.jar' ! -name '*original*' -print -quit)
          test -n "$JAR"
          rm -rf /tmp/loginplus-jar
          mkdir -p /tmp/loginplus-jar
          unzip -q "$JAR" -d /tmp/loginplus-jar
          for arquivo in config.yml plugin.yml mensagens/titulos.yml; do
            test -f "/tmp/loginplus-jar/$arquivo"
          done
          grep -F 'minimo-caracteres-senha: 7' /tmp/loginplus-jar/config.yml >/dev/null
          grep -F 'maximo-caracteres-senha: 64' /tmp/loginplus-jar/config.yml >/dev/null
          grep -F 'seguranca:' /tmp/loginplus-jar/config.yml >/dev/null
          grep -F 'max-contas-por-ip: 2' /tmp/loginplus-jar/config.yml >/dev/null
          grep -F 'max-ips-por-conta: 1' /tmp/loginplus-jar/config.yml >/dev/null
          grep -F 'max-verificacoes-mojang-por-minuto: 30' /tmp/loginplus-jar/config.yml >/dev/null
          grep -F "version: '1.1.3'" /tmp/loginplus-jar/plugin.yml >/dev/null
          ! grep -F 'tamanho-minimo-senha:' /tmp/loginplus-jar/config.yml >/dev/null
          ! grep -F 'max-contas-por-ip' src/main/java/com/authsystem/manager/PlayerDataManager.java >/dev/null
          grep -F 'tryRegisterAuthenticatedIp' src/main/java/com/authsystem/commands/LoginCommand.java >/dev/null
          grep -F 'tryRegisterAuthenticatedIp' src/main/java/com/authsystem/listeners/AuthListener.java >/dev/null
          grep -F 'podeConsultar' src/main/java/com/authsystem/listeners/PremiumVerificationListener.java >/dev/null
      - name: Publicar JAR do plugin
        uses: actions/upload-artifact@v4
        with:
          name: LoginPlus-1.1.3
          path: target/*.jar
          if-no-files-found: error
          retention-days: 7

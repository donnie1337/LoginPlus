name: Build AuthSystem

on:
  push:
    branches: [main, seguranca-hardening, corrigir-autenticacao-premium]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configurar Java 26
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '26'
          cache: maven

      - name: Baixar BuildTools
        run: curl -fsSL -o BuildTools.jar https://hub.spigotmc.org/jenkins/job/BuildTools/lastSuccessfulBuild/artifact/target/BuildTools.jar

      - name: Gerar Spigot
        run: java -jar BuildTools.jar --rev 26.2 --compile SPIGOT

      - name: Compilar plugin
        run: mvn -B clean package

      - name: Validar JAR e configurações
        run: |
          JAR=$(find target -maxdepth 1 -type f -name '*.jar' ! -name '*original*' -print -quit)
          if [ -z "$JAR" ]; then
            echo 'Nenhum JAR do plugin foi gerado em target/.'
            echo 'Conteudo de target/:'
            ls -la target/ || true
            exit 1
          fi

          echo "Validando JAR: $JAR"
          rm -rf /tmp/authsystem-jar
          mkdir -p /tmp/authsystem-jar
          unzip -q "$JAR" -d /tmp/authsystem-jar

          test -f /tmp/authsystem-jar/config.yml
          test -f /tmp/authsystem-jar/plugin.yml
          test -f /tmp/authsystem-jar/mensagens/titulos.yml

          grep -Fq 'minimo-caracteres-senha: 7' /tmp/authsystem-jar/config.yml
          grep -Fq 'maximo-caracteres-senha: 16' /tmp/authsystem-jar/config.yml
          grep -Fq 'max-contas-por-ip: 1' /tmp/authsystem-jar/config.yml
          grep -Fq 'max-ips-por-conta: 1' /tmp/authsystem-jar/config.yml

          if grep -Fq 'tamanho-minimo-senha:' /tmp/authsystem-jar/config.yml; then
            echo 'Configuracao antiga tamanho-minimo-senha encontrada no JAR.'
            exit 1
          fi

          grep -Eq '^version:[[:space:]]*[\"'"']?1\.1\.1[\"'"']?[[:space:]]*$' /tmp/authsystem-jar/plugin.yml
          grep -Fq 'password.length() > maxLength' src/main/java/com/authsystem/util/PasswordUtils.java
          grep -Fq 'max-contas-por-ip' src/main/java/com/authsystem/commands/RegisterCommand.java
          grep -Fq 'max-ips-por-conta' src/main/java/com/authsystem/manager/PlayerDataManager.java

          echo 'Validacao do JAR concluida com sucesso.'

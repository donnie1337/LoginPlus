name: Build AuthSystem

on:
  push:
    branches: [main, seguranca-hardening, corrigir-autenticacao-premium]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configurar Java 26
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '26'
          cache: maven

      - name: Baixar BuildTools
        run: curl -fsSL -o BuildTools.jar https://hub.spigotmc.org/jenkins/job/BuildTools/lastSuccessfulBuild/artifact/target/BuildTools.jar

      - name: Gerar Spigot
        run: java -jar BuildTools.jar --rev 26.2 --compile SPIGOT

      - name: Compilar plugin
        run: mvn -B clean package

      - name: Validar JAR e configurações
        run: |
          JAR=$(find target -maxdepth 1 -type f -name '*.jar' ! -name '*original*' | head -n 1)
          if [ -z "$JAR" ]; then
            echo 'Nenhum JAR do plugin foi gerado em target/.'
            echo 'Conteudo de target/:'
            ls -la target/ || true
            exit 1
          fi

          echo "Validando JAR: $JAR"
          unzip -l "$JAR" | grep -q 'config.yml'
          unzip -l "$JAR" | grep -q 'plugin.yml'
          unzip -l "$JAR" | grep -q 'mensagens/titulos.yml'
          unzip -p "$JAR" config.yml | grep -Fq 'minimo-caracteres-senha: 7'
          unzip -p "$JAR" config.yml | grep -Fq 'maximo-caracteres-senha: 16'
          unzip -p "$JAR" config.yml | grep -Fq 'max-contas-por-ip: 1'
          unzip -p "$JAR" config.yml | grep -Fq 'max-ips-por-conta: 1'
          if unzip -p "$JAR" config.yml | grep -Fq 'tamanho-minimo-senha:'; then
            echo 'Configuracao antiga tamanho-minimo-senha encontrada no JAR.'
            exit 1
          fi
          unzip -p "$JAR" plugin.yml | grep -Fq "version: '1.1.1'"
          grep -Fq 'password.length() > maxLength' src/main/java/com/authsystem/util/PasswordUtils.java
          grep -Fq 'max-contas-por-ip' src/main/java/com/authsystem/commands/RegisterCommand.java
          grep -Fq 'max-ips-por-conta' src/main/java/com/authsystem/manager/PlayerDataManager.java
